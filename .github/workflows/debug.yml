name: Debug One Case

# Manual only. Does not replace Daily Updates and does not write to MongoDB.
on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Case ID to search (default is the first missing Douglas case)"
        required: false
        default: "D 01 JV 25 0001547"
      try_county_code:
        description: "Also retry using county code (01/02/59) instead of county name"
        required: false
        type: boolean
        default: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: ${{ secrets.CASE_SEARCH_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Skip --with-deps: apt mirrors on GitHub runners can take 20+ minutes.
      # The hosted Ubuntu image already has the libraries Chromium needs.
      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run one-case debug
        run: |
          extra=""
          if [ "${{ github.event.inputs.try_county_code }}" = "true" ]; then
            extra="--try-county-code"
          fi
          python debug_one_case.py $URL "${{ github.event.inputs.case_id }}" $extra
